# Configuration de l'application MadeHospital
# Toutes les valeurs propres à un environnement (base, secrets, Orthanc, CORS) viennent de variables
# d'environnement. En local hors Docker, elles peuvent être placées dans un fichier .env (backend/ ou racine),
# lu automatiquement grâce à l'import ci-dessous. Voir .env.example à la racine du dépôt.
spring.application.name=made-hospital
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
# Derrière Traefik : respecter X-Forwarded-Proto/Host pour les URL générées (HTTPS)
server.forward-headers-strategy=framework

# Base de données PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hopital}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Sécurité
spring.security.filter.order=10
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Premier administrateur, créé au démarrage s'il n'existe pas (variables INITIAL_ADMIN_* du .env)
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.nom=${INITIAL_ADMIN_NOM:Administrateur}
app.initial-admin.prenom=${INITIAL_ADMIN_PRENOM:Principal}
app.initial-admin.telephone=${INITIAL_ADMIN_TELEPHONE:}
app.initial-admin.departement=${INITIAL_ADMIN_DEPARTEMENT:Direction}

# Journal d'audit : dossier de la clé de signature Ed25519 (volume Docker dédié, à sauvegarder)
app.audit.cles-dir=${AUDIT_CLES_DIR:audit-cles}

# CORS : origines autorisées, séparées par des virgules. Derrière Traefik le frontend et l'API partagent
# le même domaine, CORS n'intervient donc qu'en développement (Vite sur 5173).
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Orthanc (serveur DICOM)
storage.orthanc-url=${ORTHANC_URL:http://localhost:8042}
storage.orthanc-username=${ORTHANC_USERNAME:orthanc}
storage.orthanc-password=${ORTHANC_PASSWORD:orthanc}

# Stockage des images médicales non DICOM (chemin relatif au répertoire d'exécution ou absolu)
storage.base-path=${STORAGE_BASE_PATH:medical-images}
storage.scanner-path=${storage.base-path}/scanner
storage.radiography-path=${storage.base-path}/radiographie
storage.mri-path=${storage.base-path}/irm
storage.ultrasound-path=${storage.base-path}/echographie
storage.mammography-path=${storage.base-path}/mammographie
storage.angiography-path=${storage.base-path}/angiographie
storage.other-path=${storage.base-path}/autre

# Téléversement de fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-single-value-as-array=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.date-format=yyyy-MM-dd

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Journalisation
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}

# Adresse publique de l'application : utilisée dans le QR code de vérification des documents
app.url-publique=${APP_URL_PUBLIQUE:https://madehospital.sn}
